<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>六自由度机械臂 - 鼠标拖拽控制</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; }
      /* 控制面板 */
      #panel {
        position: absolute; top: 12px; left: 12px; z-index: 10;
        width: 260px; background: rgba(20, 24, 32, 0.92); color: #e8e8e8;
        border-radius: 10px; padding: 14px 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4); font-size: 13px;
        user-select: none; max-height: calc(100% - 24px); overflow-y: auto;
      }
      #panel h2 { font-size: 15px; margin-bottom: 10px; color: #fff; border-bottom: 1px solid #3a4150; padding-bottom: 8px; }
      #panel .row { display: flex; align-items: center; justify-content: space-between; margin: 7px 0; }
      #panel .row label { color: #9aa5b5; }
      #panel button {
        background: #2d6cdf; color: #fff; border: none; border-radius: 6px;
        padding: 6px 12px; cursor: pointer; font-size: 13px; transition: background .15s;
      }
      #panel button:hover { background: #3a7bf0; }
      #panel button.active { background: #e8a33d; color: #1a1a1a; }
      #panel button:disabled { background: #3a4150; color: #7a8494; cursor: not-allowed; }
      .mode-switch { display: flex; gap: 8px; margin: 10px 0; }
      .mode-switch button { flex: 1; }
      .coord-label { color: #9aa5b5; margin: 6px 0 4px; font-size: 12px; }
      .coord-row { display: flex; gap: 4px; }
      .coord-row input {
        width: 52px; background: #232936; border: 1px solid #3a4150; color: #e8e8e8;
        border-radius: 4px; padding: 5px 4px; font-size: 12px;
      }
      .coord-row input:focus { outline: none; border-color: #2d6cdf; }
      .coord-row button { flex: 1; padding: 5px 0; }
      .wp-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      .wp-row button { flex: 1; min-width: 58px; padding: 5px 2px; font-size: 12px; }
      .grip-row { display: flex; align-items: center; }
      .grip-slider { flex: 1; accent-color: #2d6cdf; }
      #joints { margin-top: 6px; }
      #joints .joint-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12px; border-bottom: 1px dashed #2c313c; }
      #joints .joint-row .name { color: #9aa5b5; width: 86px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #joints .joint-row .val { color: #7fd6a0; font-variant-numeric: tabular-nums; width: 48px; text-align: right; }
      .joint-slider { flex: 1; min-width: 0; accent-color: #2d6cdf; }
      #status { margin-top: 8px; font-size: 12px; color: #7fd6a0; min-height: 16px; }
      #hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
        background: rgba(20,24,32,0.75); color: #c8d0dc; padding: 8px 18px; border-radius: 20px; font-size: 12.5px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">🖱️ 左键拖拽关节旋转 · 右键拖动旋转视角 · 中键平移 · 滚轮缩放</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
